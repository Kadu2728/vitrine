[project]
name = "vitrine-shelf"
version = "0.1.0"
description = "Auditoria de execucao em ponto de venda por visao computacional."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vitrine" }]
keywords = ["retail", "shelf", "share-of-shelf", "merchandising", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# O modelo NAO esta aqui de proposito: ultralytics arrasta torch e alguns
# gigabytes. Ele e um extra opcional (vitrine-shelf[yolo]) porque a regra R2
# so vale se o nucleo realmente funcionar sem ele.
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]

[project.scripts]
vitrine = "vitrine.cli:app"

[project.urls]
Homepage = "https://github.com/vitrine/vitrine-shelf"

[dependency-groups]
# A pagina de demonstracao (app/) nao e parte do produto: o gradio fica num
# grupo de desenvolvimento, nunca nas dependencias base. Quem instalar
# vitrine-shelf continua recebendo so a biblioteca e a CLI.
demo = [
    "gradio>=5.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitrine"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests", "tests/property"]
addopts = "-q --strict-markers --strict-config -m 'not slow'"
markers = [
    "slow: exige modelo real ou dataset; nao roda por padrao",
    "integration: toca disco, banco ou a CLI inteira; roda por padrao",
]
filterwarnings = ["error"]

# --------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["vitrine"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_no_return = true
disallow_any_explicit = false
show_error_codes = true

[[tool.mypy.overrides]]
# A pagina de demonstracao vive fora do pacote e entra no sys.path so em tempo
# de execucao do teste; o mypy nao tem como resolver o modulo a partir daqui.
# Ela propria e verificada quando o mypy roda sobre app/.
module = ["gradio_app"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Extra opcional e sem stubs publicados. O isolamento em vision/yolo.py e
# justamente o que impede essa concessao de vazar para o resto do codigo.
module = ["ultralytics.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "SIM",         # simplify
    "TID",         # tidy imports
    "RUF",         # ruff-specific
    "ANN",         # annotations
    "D",           # pydocstyle
    "PT",          # pytest style
    "TC",          # type-checking blocks
]
ignore = [
    "D203",   # conflita com D211
    "D213",   # conflita com D212
    "ANN401", # Any explicito e permitido onde documentado
    "D107",   # convencao Google: os argumentos do construtor vao no docstring da classe
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
# A pagina de demonstracao lida com o Gradio, que passa Any por toda parte.
"app/*" = ["ANN401"]
# Num notebook o import depois do %pip install nao e desleixo, e a ordem
# obrigatoria: a biblioteca precisa existir antes de ser importada.
"notebooks/*" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
