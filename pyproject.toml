[project]
name = "vitrine-shelf"
version = "0.1.0"
description = "Auditoria de execucao em ponto de venda por visao computacional."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vitrine" }]
keywords = ["retail", "shelf", "share-of-shelf", "merchandising", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# Fase 1 e dominio puro: nenhuma dependencia de imagem, modelo ou IO.
dependencies = [
    "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/vitrine/vitrine-shelf"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitrine"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests", "tests/property"]
addopts = "-q --strict-markers --strict-config -m 'not slow'"
markers = [
    "slow: exige modelo real ou dataset; nao roda por padrao",
]
filterwarnings = ["error"]

# --------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["vitrine"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_no_return = true
disallow_any_explicit = false
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "SIM",         # simplify
    "TID",         # tidy imports
    "RUF",         # ruff-specific
    "ANN",         # annotations
    "D",           # pydocstyle
    "PT",          # pytest style
    "TC",          # type-checking blocks
]
ignore = [
    "D203",   # conflita com D211
    "D213",   # conflita com D212
    "ANN401", # Any explicito e permitido onde documentado
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
